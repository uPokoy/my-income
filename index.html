<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Мои доходы</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=8"><style>body.dark-theme{background:#111315!important;color:#f1f3f5!important}body.dark-theme header p,body.dark-theme .toolbar span,body.dark-theme .month-head span,body.dark-theme .income-row small,body.dark-theme .empty,body.dark-theme .view-subtitle{color:#9aa1ab!important}body.dark-theme .toolbar,body.dark-theme .summary,body.dark-theme .month-panel,body.dark-theme .modal-box{background:#1b1e22!important;border-color:#30343a!important;box-shadow:0 2px 14px rgba(0,0,0,.24)!important}body.dark-theme .toolbar b,body.dark-theme .month-head span b{color:#f1f3f5!important}body.dark-theme .card,body.dark-theme .view-button{background:#24282d!important;border-color:#343940!important;color:#e8eaed!important}body.dark-theme .card span,body.dark-theme th{color:#9aa1ab!important}body.dark-theme table th,body.dark-theme table td,body.dark-theme .income-row{border-color:#30343a!important}body.dark-theme .summary-row:hover{background:#24282d!important}body.dark-theme .month-tab{background:#1b1e22!important;border-color:#383d45!important;color:#d9dde2!important}body.dark-theme .month-tab.active{background:#f1f3f5!important;color:#171a1f!important;border-color:#f1f3f5!important}body.dark-theme .primary{background:#f1f3f5!important;color:#171a1f!important}body.dark-theme .delete,body.dark-theme .modal-head button,body.dark-theme .form-actions button{background:#24282d!important;border-color:#383d45!important;color:#e5e7ea!important}body.dark-theme label{color:#d6dae0!important}body.dark-theme input,body.dark-theme select{background:#24282d!important;border-color:#3a4048!important;color:#f1f3f5!important}body.dark-theme .theme-option{background:#24282d!important;border-color:#383d45!important;color:#f1f3f5!important}body.dark-theme .theme-option:hover{background:#2b2f35!important}body.dark-theme .theme-option.selected{border-color:#f1f3f5!important}body.dark-theme .theme-option small{color:#9aa1ab!important}body.dark-theme .modal{background:rgba(0,0,0,.66)!important}</style><script>try{var t=localStorage.getItem('income-theme')||'light';document.documentElement.dataset.theme=t;document.addEventListener('DOMContentLoaded',function(){document.body.classList.toggle('dark-theme',t==='dark');document.body.classList.toggle('light-theme',t!=='dark')})}catch(e){}</script></head><body><main class="app"><header><div><h1>Мои доходы</h1><p>Учет доходов по месяцам</p></div></header><section class="toolbar"><div class="year-control"><span>Год:</span><select id="year-select" aria-label="Выбор года"></select><button id="add-year" class="year-add" type="button" aria-label="Добавить год" title="Добавить год">+</button></div><button id="view-settings" class="view-button" type="button">Вид</button></section><section id="summary" class="summary"></section><section class="months-wrap"><div id="months" class="months"></div></section><section class="month-panel"><div class="month-head"><div><h2 id="month-title"></h2><span>Итого: <b id="month-total"></b></span></div></div><div id="income-list"></div></section></main><button id="add-income" class="primary floating-add" type="button" aria-label="Добавить доход" title="Добавить доход">+</button><div id="view-modal" class="modal view-modal"><div class="modal-box view-box"><div class="modal-head"><h3>Вид</h3><button id="view-close" type="button" aria-label="Закрыть">×</button></div><p class="view-subtitle">Выберите оформление приложения</p><div class="theme-options"><button class="theme-option" type="button" data-theme-choice="light"><span class="theme-preview light-preview"></span><span><b>Светлая</b><small>Классическое оформление</small></span><span class="theme-check">✓</span></button><button class="theme-option" type="button" data-theme-choice="dark"><span class="theme-preview dark-preview"></span><span><b>Темная</b><small>Комфортный вид в темноте</small></span><span class="theme-check">✓</span></button></div></div></div><div id="year-modal" class="modal"><div class="modal-box"><div class="modal-head"><h3>Добавить год</h3><button id="year-close" type="button" aria-label="Закрыть">×</button></div><p class="view-subtitle">Введите год, который хотите добавить</p><form id="new-year-form"><label>Год<input id="new-year" type="number" min="2000" max="2100" step="1" placeholder="2027" required></label><div class="form-actions"><button type="button" id="year-cancel" onclick="document.getElementById('year-modal').classList.remove('show')">Отмена</button><button class="primary" type="submit">Добавить</button></div></form></div></div><div id="income-modal" class="modal"><div class="modal-box"><div class="modal-head"><h3>Добавить доход</h3><button id="modal-close" type="button">×</button></div><form id="income-form"><label>Дата<input id="income-date" type="date" required></label><label>Описание дохода<select id="income-description" required><option value="">Выберите описание</option><option>Зарплата</option><option>Аванс</option><option>Премия</option><option>Отпускные</option><option>Бонус</option><option>Фриланс</option><option>Подработка</option><option>Продажа товара</option><option>Продажа услуги</option><option>Аренда</option><option>Дивиденды</option><option>Проценты</option><option>Кэшбэк</option><option>Подарок</option><option>Возврат денег</option><option>Другое</option></select></label><label>Источник<select id="income-source" required><option value="">Выберите источник</option><option>Зарплата</option><option>Фриланс</option><option>Продажи</option><option>Инвестиции</option><option>Подарок</option><option>Другое</option></select></label><label>Сумма<input id="income-amount" type="number" min="0.01" step="0.01" placeholder="0,00" required></label><div class="form-actions"><button type="button" id="modal-cancel">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></div></div><script src="app.js?v=8"></script><script>document.addEventListener('DOMContentLoaded',function(){var btn=document.getElementById('view-settings'),modal=document.getElementById('view-modal'),close=document.getElementById('view-close');function theme(t){t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;document.body.classList.toggle('dark-theme',t==='dark');document.body.classList.toggle('light-theme',t==='light');try{localStorage.setItem('income-theme',t)}catch(e){}document.querySelectorAll('.theme-option').forEach(function(x){x.classList.toggle('selected',x.dataset.themeChoice===t)})}if(btn&&modal){btn.addEventListener('click',function(e){e.preventDefault();theme(localStorage.getItem('income-theme')||'light');modal.classList.add('show')});if(close)close.addEventListener('click',function(){modal.classList.remove('show')});modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('show')});document.querySelectorAll('.theme-option').forEach(function(x){x.addEventListener('click',function(){theme(x.dataset.themeChoice)})})}});if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js?v=8',{updateViaCache:'none'}).then(function(r){return r.update()})})}</script></body></html>
