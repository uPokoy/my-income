<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Мои доходы</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('income-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script></head><body><main class="app"><header><div><h1>Мои доходы</h1><p>Учет доходов по месяцам</p></div><button id="add-income" class="primary">+ Добавить доход</button></header><section class="toolbar"><span>Год: <b id="year"></b></span><button id="view-settings" class="view-button">Вид</button></section><section id="summary" class="summary"></section><section class="months-wrap"><div id="months" class="months"></div></section><section class="month-panel"><div class="month-head"><div><h2 id="month-title"></h2><span>Итого: <b id="month-total"></b></span></div></div><div id="income-list"></div></section></main><div id="view-modal" class="modal view-modal"><div class="modal-box view-box"><div class="modal-head"><h3>Вид</h3><button id="view-close" aria-label="Закрыть">×</button></div><p class="view-subtitle">Выберите оформление приложения</p><div class="theme-options"><button class="theme-option" data-theme-choice="light"><span class="theme-preview light-preview"></span><span><b>Светлая</b><small>Классическое оформление</small></span><span class="theme-check">✓</span></button><button class="theme-option" data-theme-choice="dark"><span class="theme-preview dark-preview"></span><span><b>Темная</b><small>Комфортный вид в темноте</small></span><span class="theme-check">✓</span></button></div></div></div><div id="income-modal" class="modal"><div class="modal-box"><div class="modal-head"><h3>Добавить доход</h3><button id="modal-close">×</button></div><form id="income-form"><label>Дата<input id="income-date" type="date" required></label><label>Описание дохода<select id="income-description" required><option value="">Выберите описание</option><option>Зарплата</option><option>Аванс</option><option>Премия</option><option>Отпускные</option><option>Бонус</option><option>Фриланс</option><option>Подработка</option><option>Продажа товара</option><option>Продажа услуги</option><option>Аренда</option><option>Дивиденды</option><option>Проценты</option><option>Кэшбэк</option><option>Подарок</option><option>Возврат денег</option><option>Другое</option></select></label><label>Источник<select id="income-source" required><option value="">Выберите источник</option><option>Зарплата</option><option>Фриланс</option><option>Продажи</option><option>Инвестиции</option><option>Подарок</option><option>Другое</option></select></label><label>Сумма<input id="income-amount" type="number" min="0.01" step="0.01" placeholder="0,00" required></label><div class="form-actions"><button type="button" id="modal-cancel">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></div></div><script src="app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}));}</script></body></html>
